<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1310" viewBox="0 0 1600 1310" role="img" aria-labelledby="title desc"><title id="title">One product. Three frontends. One API.</title><desc id="desc">Runtime boundaries, shared code and persistent data — without a crawler.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#087D8E" stroke-width="1.5"/></marker></defs><rect width="1600" height="1310" fill="white"/><rect x="1" y="1" width="1598" height="1308" fill="none" stroke="#CCDCE5"/><path d="M64 46 H112" stroke="#087D8E" stroke-width="6"/>
<text x="132" y="53" fill="#087D8E" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" data-max-width="1000">MEDREACH  /  ENGINEERING</text>
<text x="64" y="116" fill="#12384A" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start" data-max-width="1472">One product. Three frontends. One API.</text>
