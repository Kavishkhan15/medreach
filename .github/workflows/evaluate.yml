name: evaluate

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [bootstrap, tailwind, skeleton]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Create artifact directory
        run: |
          mkdir -p data/raw

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Build production variant
        run: npm --workspace @medreach/variant-${{ matrix.variant }} run build

      - name: Compute RWD Security Risk Score
        run: |
          node evaluation/scoring/risk-score.js
