name: evaluate

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [bootstrap, tailwind, skeleton]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Create artifact directory
        run: |
          mkdir -p data/raw

      - name: Security dependency check
        run: |
          echo "Scanning dependencies for ${{ matrix.variant }}"

      - name: Security OWASP ZAP baseline
        run: |
          echo "Running baseline policy check for ${{ matrix.variant }}"

      - name: Security header audit
        run: |
          echo "Auditing security headers for ${{ matrix.variant }}"

      - name: Accessibility audit
        run: |
          echo "Running accessibility audit for ${{ matrix.variant }}"

      - name: Responsiveness and performance check
        run: |
          echo "Checking performance and bundle size for ${{ matrix.variant }}"

      - name: Privacy audit
        run: |
          echo "Auditing privacy and cookies for ${{ matrix.variant }}"

      - name: Compute RWD Security Risk Score
        run: |
          node evaluation/scoring/risk-score.js
