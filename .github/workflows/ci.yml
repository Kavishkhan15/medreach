name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Lint frontends and shared core
        run: npm run lint
      - name: Run focused unit tests
        run: node --test tests/unit/*.test.mjs
      - name: Validate patch whitespace
        run: git diff --check

  build-variants:
    name: Build Variant (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [bootstrap, tailwind, skeleton]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build variant
        run: |
          npm --workspace @medreach/variant-${{ matrix.variant }} run build

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017/medreach_ci_test
      JWT_SECRET: ci_jwt_secret_for_testing_12345
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Expose MongoDB backup tools from service container
        env:
          MONGODB_SERVICE_ID: ${{ job.services.mongodb.id }}
        run: |
          tools_dir="$RUNNER_TEMP/medreach-mongodb-tools"
          mkdir -p "$tools_dir"
          for tool in mongodump mongorestore; do
            docker cp "$MONGODB_SERVICE_ID:/usr/bin/$tool" "$tools_dir/$tool"
            chmod +x "$tools_dir/$tool"
            "$tools_dir/$tool" --version
          done
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Start isolated replica set for capacity transaction tests
        run: |
          docker run --detach --name medreach-capacity-test --network host mongo:6.0 mongod --replSet medreach-capacity-test --port 27018 --bind_ip 127.0.0.1
          for attempt in $(seq 1 60); do
            if docker exec medreach-capacity-test mongosh 'mongodb://127.0.0.1:27018/admin?directConnection=true' --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec medreach-capacity-test mongosh 'mongodb://127.0.0.1:27018/admin?directConnection=true' --quiet --eval 'rs.initiate({_id:"medreach-capacity-test",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 60); do
            if docker exec medreach-capacity-test mongosh 'mongodb://127.0.0.1:27018/admin?directConnection=true' --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run backend tests with all MongoDB gates enabled
        env:
          MEDREACH_BASE_TEST_MONGO_URI: mongodb://localhost:27017/medreach_test
          MEDREACH_AUTH_TEST_MONGO_URI: mongodb://localhost:27017/medreach_auth_test
          MEDREACH_PRODUCT_TEST_MONGO_URI: mongodb://localhost:27017/medreach_product_integration
          MEDREACH_TEST_MONGO_URI: mongodb://localhost:27017/medreach_fusion_integration
        run: npm run backend:test:db

      - name: Stop isolated capacity replica set
        if: always()
        run: docker rm --force medreach-capacity-test || true

  browser-tests:
    name: Critical Browser Journeys
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MEDREACH_E2E_MONGO_URI: mongodb://localhost:27017/medreach_e2e
      NEXT_TELEMETRY_DISABLED: 1
      # Exercise the real directory and map fallback without external quota.
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build all production variants
        run: npm run build:variants

      - name: Run browser release journeys
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  evaluation:
    name: RWD Evaluation Scoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run evaluation score
        run: |
          npm run score
