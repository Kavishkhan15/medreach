name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  crawler-tests:
    name: Crawler Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run crawler tests
        run: |
          npm --workspace @medreach/crawler test

  build-variants:
    name: Build Variant (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [bootstrap, tailwind, skeleton]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build variant
        run: |
          npm --workspace @medreach/variant-${{ matrix.variant }} run build

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/medreach_ci_test
      JWT_SECRET: ci_jwt_secret_for_testing_12345
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run backend tests
        run: |
          npm --workspace @medreach/backend test

  evaluation:
    name: RWD Evaluation Scoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run evaluation score
        run: |
          npm run score
