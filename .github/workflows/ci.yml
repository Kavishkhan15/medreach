name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-variants:
    name: Build Variant (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [bootstrap, tailwind, skeleton]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build variant
        run: |
          npm --workspace @medreach/variant-${{ matrix.variant }} run build

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017/medreach_ci_test
      JWT_SECRET: ci_jwt_secret_for_testing_12345
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with all MongoDB gates enabled
        env:
          MEDREACH_BASE_TEST_MONGO_URI: mongodb://localhost:27017/medreach_test
          MEDREACH_AUTH_TEST_MONGO_URI: mongodb://localhost:27017/medreach_auth_test
          MEDREACH_PRODUCT_TEST_MONGO_URI: mongodb://localhost:27017/medreach_product_integration
          MEDREACH_TEST_MONGO_URI: mongodb://localhost:27017/medreach_fusion_integration
        run: npm run backend:test:db

  browser-tests:
    name: Critical Browser Journeys
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MEDREACH_E2E_MONGO_URI: mongodb://localhost:27017/medreach_e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build all production variants
        run: npm run build:variants

      - name: Run browser release journeys
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  evaluation:
    name: RWD Evaluation Scoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run evaluation score
        run: |
          npm run score
