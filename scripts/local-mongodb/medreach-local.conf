# Override the packaged system service for this machine's local dataset.
[Service]
User=anonymous
Group=anonymous
UMask=0077
LimitNOFILE=65536
# MongoDB 8.0.32 / Linux 7.0: keep glibc rseq registration enabled so
# TCMalloc does not activate the incompatible per-CPU cache path.
Environment="GLIBC_TUNABLES=glibc.pthread.rseq=1"
ExecStart=
ExecStart=/usr/bin/mongod --config /home/anonymous/medreach/scripts/local-mongodb/mongod.conf
